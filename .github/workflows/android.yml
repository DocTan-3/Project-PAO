name: Android APK

# Builds an installable APK on every push and on demand from the Actions tab.
# A release is published when you push a version tag (for example v0.1.0), or when you start the
# workflow by hand from the Actions tab and type a version (for example 0.1.0): the tag is created for you.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, e.g. 0.1.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write # needed to create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, check and test the web app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # a tag like v0.1.0 becomes the app's version name 0.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$INPUT_VERSION" ]]; then export APP_VERSION="${INPUT_VERSION#v}"; fi
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Songbook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Songbook-apk
          path: Songbook.apk
          if-no-files-found: error

      - name: Publish a GitHub Release (version tag or manual version)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ -n "$INPUT_VERSION" ]]; then TAG="v${INPUT_VERSION#v}"; fi
          cat > install-notes.md <<'NOTES'
          ## Install on Android
          1. On the phone, open this page and download **Songbook.apk**, then open it.
          2. Android will ask to allow installs from this source. Allow it, then tap **Install**.
          3. Later versions install over this one and **keep your songs and line ups**.

          > **Installed an earlier test build?** Uninstall it once before installing this one (this is the first build
          > with a fixed signing key, so Android treats it as a different app). Songs saved in the old copy are removed
          > with it. From here on, updates install over the top without losing anything.

          This is a sideload build (signed with the shared debug key), not a Play Store release.

          ---
          NOTES
          gh release create "$TAG" Songbook.apk --target "$GITHUB_SHA" \
            --title "BPCG - PAW ${TAG}" \
            --notes-file install-notes.md \
            --generate-notes
