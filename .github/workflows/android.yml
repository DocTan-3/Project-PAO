name: Android APK

# Builds an installable APK of the app on every push, and on demand from the Actions tab.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, check and test the web app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Songbook-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Songbook-debug-apk
          path: Songbook-debug.apk
          if-no-files-found: error
