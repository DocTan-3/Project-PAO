name: Android APK

# Builds an installable APK on every push and on demand from the Actions tab.
# A release is published when you push a version tag (for example v0.1.0), or when you start the
# workflow by hand from the Actions tab and type a version (for example 0.1.0): the tag is created for you.
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version, e.g. 0.1.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write # needed to create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install, check and test the web app
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build the web app and copy it into the Android project
        env:
          # team updates and admin mode (all optional; see README, "Team updates")
          VITE_GIST_ID: ${{ vars.GIST_ID }}
          VITE_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # a tag like v0.1.0 becomes the app's version name 0.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$INPUT_VERSION" ]]; then export APP_VERSION="${INPUT_VERSION#v}"; fi
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PAW.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PAW-apk
          path: PAW.apk
          if-no-files-found: error

      - name: Publish a GitHub Release (version tag or manual version)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ -n "$INPUT_VERSION" ]]; then TAG="v${INPUT_VERSION#v}"; fi
          cat > install-notes.md <<'NOTES'
          ## Install BPCG - PAW on Android
          1. On the phone, open this page and download **PAW.apk** (that is the app file), then tap it to open it.
          2. Android will ask to allow installs from this browser. Allow it, then tap **Install**.
          3. A newer version installs over the old one and **keeps your songs and line ups**.

          This app file is installed by hand, not from the Play Store. Android may show a warning about that; it is expected.

          ---
          NOTES
          gh release create "$TAG" PAW.apk --target "$GITHUB_SHA" \
            --title "BPCG - PAW ${TAG}" \
            --notes-file install-notes.md \
            --generate-notes
